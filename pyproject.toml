[project]
name = "frontend-spec-experiment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
orchestration = ["langgraph>=1,<2", "litellm>=1,<2", "langfuse>=3,<4"]
backend = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["packages/contracts/src", "packages/spec_generator/src", "packages/experiment_controller/src"]
testpaths = ["tests"]